    <!-- Aplica el tema guardado antes de pintar para evitar el parpadeo. -->
    <script>
      try {
        var saved = localStorage.getItem("theme")
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Skeleton screen: se ve mientras carga JavaScript; React lo reemplaza al montar. Usa estilos de src/index.css. -->
    <div id="root">
      <div class="boot-skeleton" aria-hidden="true">
        <div class="boot-nav">
          <div class="container boot-nav-inner">
            <span class="sk" style="width: 150px; height: 28px"></span>
            <span class="sk boot-nav-links" style="width: 440px; height: 14px"></span>
          </div>
        </div>
        <div class="container hero">
          <div class="sk-card">
            <span class="sk sk-pill" style="width: 230px; height: 30px"></span>
            <span class="sk" style="width: min(360px, 90%); height: 56px"></span>
            <span class="sk" style="width: min(300px, 80%); height: 22px"></span>
            <span class="sk" style="width: min(480px, 100%); height: 64px"></span>
            <span class="sk" style="width: min(320px, 85%); height: 14px"></span>
            <div class="sk-inline">
              <span class="sk" style="width: 170px; height: 44px"></span>
              <span class="sk" style="width: 110px; height: 44px"></span>
            </div>
          </div>
          <div class="hero-summary card sk-card boot-summary">
            <span class="sk" style="width: 40%; height: 10px"></span>
            <span class="sk" style="width: 85%; height: 16px"></span>
            <span class="sk" style="width: 40%; height: 10px"></span>
            <span class="sk" style="width: 75%; height: 16px"></span>
            <span class="sk" style="width: 40%; height: 10px"></span>
            <span class="sk" style="width: 80%; height: 16px"></span>
            <span class="sk" style="width: 40%; height: 10px"></span>
            <span class="sk" style="width: 60%; height: 16px"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
